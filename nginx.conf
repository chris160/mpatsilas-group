server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "public, max-age=300"; }
  location /img/ { add_header Cache-Control "public, max-age=2592000, immutable"; }
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
